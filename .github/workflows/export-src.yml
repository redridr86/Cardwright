name: export-src
on:
  workflow_dispatch:
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack built app and source
        run: |
          mkdir -p export
          zip -r export/cardwright-www.zip desktop-host/www
          zip -r export/cardwright-src.zip src desktop desktop-host vite.desktop.config.ts package.json \
            -x 'desktop-host/www/*' 'desktop-host/www/**' 'public/Cardwright.exe'
      - uses: actions/upload-artifact@v4
        with:
          name: cardwright-export
          path: export/
          retention-days: 1
